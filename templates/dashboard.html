<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭日记系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🏠 家庭日记</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="public-view">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">公共日记</span>
                </button>
                <button class="nav-item" data-page="private-view">
                    <span class="nav-icon">🔒</span>
                    <span class="nav-text">我的日记</span>
                </button>
                <button class="nav-item" data-page="public-write">
                    <span class="nav-icon">✍️</span>
                    <span class="nav-text">写公共日记</span>
                </button>
                <button class="nav-item" data-page="private-write">
                    <span class="nav-icon">📝</span>
                    <span class="nav-text">写私密日记</span>
                </button>
                {% if is_admin %}
                <button class="nav-item" data-page="admin-panel" onclick="window.location.href='/admin/'">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">管理员后台</span>
                </button>
                {% endif %}
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="username">{{ username }}</span>
                </div>
                <button id="logoutBtn" class="btn-logout">退出登录</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 公共日记查看 -->
            <div id="public-view" class="page active">
                <div class="page-header">
                    <h1>家庭公共日记</h1>
                    <div class="page-header-actions">
                        <button class="btn-preview-all" onclick="openPageFullPreview()">🔍 全览全部</button>
                        <button class="btn-refresh" onclick="loadPublicDiaries()">🔄 刷新</button>
                    </div>
                </div>
                <div class="page-body">
                    <div id="publicDiaries" class="diary-grid"></div>
                </div>
            </div>

            <!-- 个人日记查看 -->
            <div id="private-view" class="page">
                <div class="page-header">
                    <h1>我的私密日记</h1>
                    <div class="page-header-actions">
                        <button class="btn-preview-all" onclick="openPageFullPreview()">🔍 全览全部</button>
                        <button class="btn-refresh" onclick="loadPrivateDiaries()">🔄 刷新</button>
                    </div>
                </div>
                <div class="page-body">
                    <div id="privateDiaries" class="diary-grid"></div>
                </div>
            </div>

            <!-- 写公共日记 -->
            <div id="public-write" class="page">
                <div class="page-header">
                    <h1>撰写公共日记</h1>
                </div>
                <div class="page-body">
                    <form id="publicDiaryForm" class="diary-form-card" enctype="multipart/form-data">
                        <input type="hidden" name="diary_type" value="public">
                        
                        <div class="form-section">
                            <h3>📅 日期选择</h3>
                            <div class="date-selector-group">
                                <button type="button" class="btn-today" onclick="setTodayDate('public')">今天</button>
                                <input type="date" id="publicDate" name="date" class="input-date">
                                <input type="text" id="publicDateCustom" placeholder="YYYY-MM-DD" class="input-date-custom" maxlength="10">
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>📝 文字记录</h3>
                            <textarea id="publicContent" name="content" rows="10" placeholder="记录今天发生的事情..."></textarea>
                        </div>

                        <div class="form-section">
                            <h3>🖼️ 图片记录</h3>
                            <div class="file-upload-area" id="publicImagesArea">
                                <input type="file" id="publicImages" name="images" multiple accept="image/*">
                                <label for="publicImages" class="file-label">点击选择图片</label>
                                <div class="file-list" id="publicImagesList"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>🎥 视频记录</h3>
                            <div class="file-upload-area" id="publicVideosArea">
                                <input type="file" id="publicVideos" name="videos" multiple accept="video/*">
                                <label for="publicVideos" class="file-label">点击选择视频</label>
                                <div class="file-list" id="publicVideosList"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>📎 其他文件</h3>
                            <div class="file-upload-area" id="publicFilesArea">
                                <input type="file" id="publicFiles" name="files" multiple>
                                <label for="publicFiles" class="file-label">点击选择文件</label>
                                <div class="file-list" id="publicFilesList"></div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">💾 保存日记</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 写私密日记 -->
            <div id="private-write" class="page">
                <div class="page-header">
                    <h1>撰写私密日记</h1>
                </div>
                <div class="page-body">
                    <form id="privateDiaryForm" class="diary-form-card" enctype="multipart/form-data">
                        <input type="hidden" name="diary_type" value="private">
                        
                        <div class="form-section">
                            <h3>📅 日期选择</h3>
                            <div class="date-selector-group">
                                <button type="button" class="btn-today" onclick="setTodayDate('private')">今天</button>
                                <input type="date" id="privateDate" name="date" class="input-date">
                                <input type="text" id="privateDateCustom" placeholder="YYYY-MM-DD" class="input-date-custom" maxlength="10">
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>📝 文字记录</h3>
                            <textarea id="privateContent" name="content" rows="10" placeholder="记录你的私人想法..."></textarea>
                        </div>

                        <div class="form-section">
                            <h3>🖼️ 图片记录</h3>
                            <div class="file-upload-area" id="privateImagesArea">
                                <input type="file" id="privateImages" name="images" multiple accept="image/*">
                                <label for="privateImages" class="file-label">点击选择图片</label>
                                <div class="file-list" id="privateImagesList"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>🎥 视频记录</h3>
                            <div class="file-upload-area" id="privateVideosArea">
                                <input type="file" id="privateVideos" name="videos" multiple accept="video/*">
                                <label for="privateVideos" class="file-label">点击选择视频</label>
                                <div class="file-list" id="privateVideosList"></div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>📎 其他文件</h3>
                            <div class="file-upload-area" id="privateFilesArea">
                                <input type="file" id="privateFiles" name="files" multiple>
                                <label for="privateFiles" class="file-label">点击选择文件</label>
                                <div class="file-list" id="privateFilesList"></div>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-submit">💾 保存日记</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const currentUserId = {{ user_id }};
        const isCurrentUserAdmin = {{ 'true' if is_admin else 'false' }};
    </script>
    <script src="/static/js/diary.js"></script>
</body>
</html>
