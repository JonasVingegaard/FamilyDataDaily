<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🔧 管理员后台</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-page="admin-users">
                    <span class="nav-icon">👥</span>
                    <span class="nav-text">用户管理</span>
                </button>
                <button class="nav-item" data-page="admin-diaries">
                    <span class="nav-icon">📚</span>
                    <span class="nav-text">日记管理</span>
                </button>
                <button class="nav-item" data-page="admin-files">
                    <span class="nav-icon">📁</span>
                    <span class="nav-text">文件管理</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button id="backToDiary" class="btn-logout">返回日记</button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 用户管理 -->
            <div id="admin-users" class="page active">
                <div class="page-header">
                    <h1>👥 用户管理</h1>
                    <button class="btn-refresh" onclick="loadUsers()">🔄 刷新</button>
                </div>
                <div class="page-body">
                    <div class="table-container">
                        <table class="data-table" id="usersTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>邮箱</th>
                                    <th>角色</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 日记管理 -->
            <div id="admin-diaries" class="page">
                <div class="page-header">
                    <h1>📚 日记管理</h1>
                    <button class="btn-refresh" onclick="loadAllDiaries()">🔄 刷新</button>
                </div>
                <div class="page-body">
                    <div class="table-container">
                        <table class="data-table" id="diariesTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>作者</th>
                                    <th>类型</th>
                                    <th>日期</th>
                                    <th>内容摘要</th>
                                    <th>文件数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="diariesTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 文件管理 -->
            <div id="admin-files" class="page">
                <div class="page-header">
                    <h1>📁 文件管理</h1>
                    <button class="btn-refresh" onclick="loadFiles()">🔄 刷新</button>
                </div>
                <div class="page-body">
                    <div class="table-container">
                        <table class="data-table" id="filesTable">
                            <thead>
                                <tr>
                                    <th>文件名</th>
                                    <th>类型</th>
                                    <th>大小</th>
                                    <th>路径</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="filesTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 重置密码模态框 -->
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🔑 重置密码</h2>
                <span class="modal-close" onclick="closeModal('resetPasswordModal')">&times;</span>
            </div>
            <div class="modal-body">
                <p>用户: <strong id="resetUsername"></strong></p>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="text" id="newPassword" placeholder="输入新密码">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('resetPasswordModal')">取消</button>
                <button class="btn-primary" onclick="confirmResetPassword()">确认重置</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
